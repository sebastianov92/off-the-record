# Off the Record on the mini PC. CasaOS: App Store > Custom Install > Import,
# paste this file. Plain Docker: docker compose -f off-the-record.casaos.yml up -d
name: off-the-record

services:
  off-the-record:
    image: ghcr.io/sebastianov92/off-the-record:latest
    container_name: off-the-record
    # Host networking (Linux): the app sees the mini PC's own LAN address for the QR
    # code, and phones can reach it by any address (LAN, Tailscale, hostname). With
    # bridge networking it would need -u, and Socket.IO then refuses every other address.
    network_mode: host
    environment:
      TZ: America/Guayaquil
    volumes:
      - type: bind
        source: /DATA/AppData/off-the-record/songs
        target: /app/pikaraoke-songs
      # Settings, the database, the AI's stems and lyrics, and the models (~2 GB).
      - type: bind
        source: /DATA/AppData/off-the-record/data
        target: /home/pikaraoke/.pikaraoke
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    x-casaos:
      envs:
        - container: TZ
          description:
            en_us: Time zone
            es_es: Zona horaria
      volumes:
        - container: /app/pikaraoke-songs
          description:
            en_us: Songs
            es_es: Canciones
        - container: /home/pikaraoke/.pikaraoke
          description:
            en_us: Settings, database, AI files and models
            es_es: Ajustes, base de datos, archivos de la IA y modelos

x-casaos:
  architectures:
    - amd64
  main: off-the-record
  author: Dezik Labs
  developer: Dezik Labs
  category: Entertainment
  icon: https://raw.githubusercontent.com/sebastianov92/off-the-record/karaoke-ai/pikaraoke/static/brand/app-icon.png
  index: /
  port_map: "5555"
  scheme: http
  title:
    en_us: Off the Record
  tagline:
    en_us: Karaoke with AI vocal removal and word-timed lyrics
    es_es: Karaoke que quita la voz y muestra la letra palabra por palabra
  description:
    en_us: >-
      A fork of PiKaraoke. Search YouTube from your phone, queue songs, and sing on the TV:
      the singer's voice is removed, the lyrics fill word by word, and the microphone gives a real score.
    es_es: >-
      Un fork de PiKaraoke. Busca en YouTube desde el celular, arma la cola y canta en la tele:
      se quita la voz del cantante, la letra se rellena palabra por palabra y el micrófono da un puntaje real.
